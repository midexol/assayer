name: Collect prices

# Every 5 minutes (GitHub's minimum; runs can start a few minutes late).
# Keys come from repository secrets: Settings > Secrets and variables > Actions.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"
      - name: Nasdaq reference prices
        run: python -m assayer.collect.reference
