[project]
name = "oneprice"
version = "0.1.0"
description = "Measures how far tokenized US stocks drift from one fair price across chains and exchanges."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["oneprice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
